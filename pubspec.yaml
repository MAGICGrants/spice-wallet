name: spice_wallet
description: "A light multicoin wallet."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: 3.11.5
  flutter: 3.41.7

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/launcher_icon.png"
    icon_size: 48
  image_path: "assets/launcher_icon.png"
  adaptive_icon_background: "#263F5F"
  adaptive_icon_foreground: "assets/launcher_icon.png"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # SHA-pinned (not `main`) to unify with wallet_infra's tor pin and keep
  # rebuilds reproducible.
  tor_ffi_plugin:
    git:
      url: https://github.com/cypherstack/tor
      ref: c2706eeb66174273a4a98113d7a8cd910ba124e6
  # magicgrants/monero_c (not vtnerd/lwsf) to match wallet_monero — its pin
  # carries Wallet_estimateTransactionFee and lwsf armv7/mingw fixes (D1).
  monero:
    git:
      url: https://github.com/magicgrants/monero_c
      ref: 757bf8ef3874953a076b07a2407b17bf9eeef5c0
      path: impls/monero.dart

  # wallet-core packages; SHA-pinned for release, redirected to the local
  # sibling clone by the gitignored pubspec_overrides.yaml for dev.
  wallet_infra:
    git:
      url: https://github.com/MAGICGrants/wallet-core
      ref: f674cb907ab971126a88dcc78c33b549b630f58f
      path: packages/wallet_infra
  wallet_domain:
    git:
      url: https://github.com/MAGICGrants/wallet-core
      ref: f674cb907ab971126a88dcc78c33b549b630f58f
      path: packages/wallet_domain
  wallet_monero:
    git:
      url: https://github.com/MAGICGrants/wallet-core
      ref: f674cb907ab971126a88dcc78c33b549b630f58f
      path: packages/wallet_monero
  wallet_bitcoin:
    git:
      url: https://github.com/MAGICGrants/wallet-core
      ref: f674cb907ab971126a88dcc78c33b549b630f58f
      path: packages/wallet_bitcoin
  wallet_ethereum:
    git:
      url: https://github.com/MAGICGrants/wallet-core
      ref: f674cb907ab971126a88dcc78c33b549b630f58f
      path: packages/wallet_ethereum
  wallet_openalias:
    git:
      url: https://github.com/MAGICGrants/wallet-core
      ref: f674cb907ab971126a88dcc78c33b549b630f58f
      path: packages/wallet_openalias
  cupertino_icons: 1.0.8
  path: 1.9.1
  provider: 6.1.5+1
  path_provider: 2.1.5
  dart_date: 1.5.3
  qr_flutter: 4.1.0
  share_plus: 11.1.0
  intl: 0.20.2
  shared_preferences: 2.5.3
  http: 1.6.0
  workmanager: 0.9.0+3
  flutter_foreground_task: 8.17.0
  flutter_local_notifications: 19.5.0
  timeago: 3.7.1
  flutter_riverpod: 2.6.1
  screen_brightness: 2.1.7
  flutter_zxing: 2.3.0
  permission_handler: 12.0.1
  flutter_svg: 2.2.3
  skeletonizer: 2.1.1
  flutter_secure_storage: 9.2.4
  local_auth: 2.3.0
  flutter_launcher_icons: 0.14.4
  gpt_markdown: 1.1.4
  polyseed: 0.0.7
  bip39: 1.0.6
  bip32: 2.0.0
  package_info_plus: 8.3.0
  pointycastle: 3.9.1
  webcrypto: 0.6.0
  screen_protector: 1.5.2

# bitcoin_base, blockchain_utils and web3dart are no longer direct deps — the
# wallet_bitcoin / wallet_ethereum packages own them. The overrides below pin
# the forks to SHAs, since dependency_overrides do not transit package
# boundaries (D13): a consumer of wallet-core must repeat them.
dependency_overrides:
  hashlib: 1.19.2
  intl: any
  bip39:
    git:
      url: https://github.com/cypherstack/stack-bip39
      ref: 0cd6d54e2860bea68fc50c801cb9db2a760192fb
  web3dart:
    git:
      url: https://github.com/cake-tech/web3dart.git
      ref: aa3f932dbf54eda651b7bd01ad00204acf998bd0
  blockchain_utils:
    git:
      url: https://github.com/cake-tech/blockchain_utils
      ref: 59fdf29d72068e0522a96a8953ed7272833a9f57

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: 5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/cacert.pem
    - assets/app_icon.ico

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
